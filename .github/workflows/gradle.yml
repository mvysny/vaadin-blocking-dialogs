name: Gradle

on: [push, pull_request]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [21, 25]
        # the loom runner's reflection hack is JVM-implementation-sensitive (JDK-8308541)
        distribution: [oracle, corretto, temurin]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: ${{ matrix.distribution }}
        # intentionally no `cache:` - setup-gradle handles Gradle caching
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      # JDK 21 pins (R_vt_pinning), which the loom runner refuses unless told otherwise
      run: ./gradlew clean build '-Pvaadin.productionMode' --no-daemon --no-watch-fs ${{ matrix.java < 24 && '-Dblockingdialogs.uifiber.loom.allowPinningJdk=true' || '' }}

  design-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Design doc tripwires
      run: ./design/verify_design_tripwires.sh
